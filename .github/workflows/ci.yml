name: CI — analytics-service

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:

  # ══════════════════════════════════════════════════════════════
  # JOB 1 -— Build e Testes Unitários (paralelo ao lint)
  # ══════════════════════════════════════════════════════════════
  build-and-test:
    name: "1 · Build & Testes Unitários"
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de teste
        run: pip install -r requirements-test.txt

      - name: Executar testes com cobertura
        run: |
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml
        env:
          AWS_REGION: "us-east-1"
          AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/123/test-queue"
          AWS_DYNAMODB_TABLE: "test-table"

      - name: Publicar resultados dos testes no Job Summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: Publicar cobertura no Job Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Complexidade ciclomática (radon)
        if: always()
        run: radon cc app.py -s -a

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-test-reports
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — Lint / Análise Estática (paralelo ao build-and-test)
  # ══════════════════════════════════════════════════════════════
  lint:
    name: "2 · Lint / Análise Estática"
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flake8
        run: pip install flake8==7.1.1

      - name: Executar flake8 e publicar no Job Summary
        run: |
          echo "## 🔍 Lint — flake8" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(flake8 app.py --max-line-length=120 --statistics 2>&1) || true
          COUNT=$(flake8 app.py --max-line-length=120 --count --quiet 2>/dev/null | tail -1 || echo "0")
          if [ -z "$OUTPUT" ]; then
            echo "✅ Nenhum problema encontrado." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ **$COUNT problema(s) encontrado(s)** — não bloqueia a pipeline." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "$OUTPUT"

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — Docker Build (aguarda jobs 1 e 2)
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: "3 · Docker Build"
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: analytics-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/analytics-service.tar

      - uses: actions/upload-artifact@v4
        with:
          name: analytics-docker-image
          path: /tmp/analytics-service.tar
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — Scan de Vulnerabilidades com Trivy
  # ══════════════════════════════════════════════════════════════
  trivy-scan:
    name: "4 · Scan de Vulnerabilidades (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: analytics-docker-image
          path: /tmp

      - name: Carregar imagem
        run: docker load --input /tmp/analytics-service.tar

      - name: Trivy — scan e publicar no Job Summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: analytics-service:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy — salvar relatório JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: analytics-service:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-trivy-report
          path: trivy-report.json
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — Push para AWS ECR (somente na branch main)
  # Requer secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  # ══════════════════════════════════════════════════════════════
  push-ecr:
    name: "5 · Push para AWS ECR"
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/download-artifact@v4
        with:
          name: analytics-docker-image
          path: /tmp

      - run: docker load --input /tmp/analytics-service.tar

      - name: Tag e push para ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-prod/analytics-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker tag analytics-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "✅ Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA" >> $GITHUB_STEP_SUMMARY